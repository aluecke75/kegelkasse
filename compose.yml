services:

  kegelkasse:

    container_name: kegelkasse

    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        DEVELOPERKIT_VERSION: ${DEVELOPERKIT_VERSION:-v0.1.9}

    init: true

    restart: unless-stopped

    ports:
      - "${APP_PORT}:5000"

    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEVELOPER_MODE: ${DEVELOPER_MODE}

    volumes:

      # Datenbank
      - ${KEGELKASSE_DATABASE_PATH:-./data/database}:/app/database

      # Backups
      - ${KEGELKASSE_BACKUP_PATH:-./data/backups}:/app/backups

      # Dokumente / Uploads
      - ${KEGELKASSE_UPLOADS_PATH:-./data/uploads}:/app/uploads

      # Logs
      - ${KEGELKASSE_LOGS_PATH:-./logs}:/app/logs

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
