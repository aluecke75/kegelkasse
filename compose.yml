services:

  kegelkasse:

    container_name: kegelkasse

    build:
      context: ./app
      dockerfile: Dockerfile
      
    init: true

    restart: unless-stopped

    ports:
      - "${APP_PORT}:5000"

    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    volumes:

      # Datenbank
      - ./data/database:/app/database

      # Backups
      - ./data/backups:/app/backups

      # Dokumente / Uploads
      - ./data/uploads:/app/uploads

      # Logs
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
