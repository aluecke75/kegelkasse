{% extends "base.html" %}
{% block content %}
<div class="modern-header">
    <div class="modern-icon">🔐</div>
    <div>
        <h1>Neues Passwort setzen</h1>
        <p>Konto: {{ reset.user.username }}</p>
    </div>
</div>

<div class="modern-card" style="max-width:680px;">
    <div class="tip-box" style="margin-top:0;">
        <div>💡</div>
        <div>Aktuelle Passwortvorgabe: <strong>{{ password_policy_text }}</strong></div>
    </div>

    <form method="post" class="form-grid">
        <label>Neues Passwort
            <input type="password" name="new_password" required autocomplete="new-password">
        </label>

        <label>Neues Passwort wiederholen
            <input type="password" name="new_password_repeat" required autocomplete="new-password">
        </label>

        <div class="inline-actions">
            <button type="submit">Passwort speichern</button>
        </div>
    </form>
</div>
{% endblock %}
