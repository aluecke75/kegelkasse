{% extends "base.html" %}

{% block content %}
<div class="modern-header">
    <div class="modern-icon">🎳</div>
    <div>
        <h1>Neue Regel für Gast-Strafen anlegen</h1>
        <p>Bestehende Regeln bleiben erhalten. Änderungen werden mit Gültigkeitsdatum historisiert.</p>
    </div>
</div>

<div class="modern-card" style="max-width:780px;">
    <form method="post" class="form-grid">
        <label>Zahlt der Gast neben der Gastgebühr auch Strafen?
            <select name="charge_penalties" required>
                <option value="1">Ja, zusätzlich zur Gastgebühr</option>
                <option value="0">Nein, nur die feste Gastgebühr</option>
            </select>
        </label>

        <label>Gültig ab
            <input type="date" name="valid_from" value="{{ today }}" required>
        </label>

        <label style="grid-column:1 / -1;">Bemerkung
            <textarea name="note" rows="4" placeholder="optional"></textarea>
        </label>

        <div class="inline-actions" style="grid-column:1 / -1;">
            <button type="submit">Speichern</button>
            <a class="button secondary" href="{{ url_for('rate_settings') }}">Abbrechen</a>
        </div>
    </form>
</div>
{% endblock %}
