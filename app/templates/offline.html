<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Kegelkasse – keine Verbindung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#122017">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f7fb; color: #18212f; }
        .box { max-width: 380px; margin: 1rem; padding: 2rem 1.5rem; background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07); text-align: center; }
        .icon { font-size: 3rem; margin-bottom: .5rem; }
        h1 { font-size: 1.3rem; margin: 0 0 .6rem; }
        p { color: #667085; line-height: 1.5; margin: 0 0 1.4rem; }
        button { background: #176a2f; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🎳</div>
        <h1>Keine Verbindung</h1>
        <p>Die Kegelkasse kann gerade nicht erreicht werden. Aus Datenschutzgründen werden Vereinsdaten nicht auf dem Handy zwischengespeichert – bitte prüfe deine Internetverbindung und versuche es erneut.</p>
        <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </div>
</body>
</html>
