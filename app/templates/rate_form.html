{% extends "base.html" %}

{% block content %}
<div class="modern-header">
    <div class="modern-icon">€</div>
    <div>
        <h1>Neuen Wert anlegen</h1>
        <p>Bestehende Werte bleiben erhalten. Änderungen werden mit Gültigkeitsdatum historisiert.</p>
    </div>
</div>

<div class="modern-card" style="max-width:780px;">
    <form method="post" class="form-grid">
        <label>Typ
            <select name="key" required>
                {% for key, label in rate_types.items() %}
                    <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </label>

        <label>Betrag in Euro
            <input class="money-input" type="text" name="amount" placeholder="z. B. 20,00" inputmode="decimal" autocomplete="off" required>
            <small>Eingaben wie 5, 5,5 oder ,30 werden automatisch formatiert.</small>
        </label>

        <label>Gültig ab
            <input type="date" name="valid_from" value="{{ today }}" required>
        </label>

        <label style="grid-column:1 / -1;">Bemerkung
            <textarea name="note" rows="4" placeholder="optional"></textarea>
        </label>

        <div class="inline-actions" style="grid-column:1 / -1;">
            <button type="submit">Speichern</button>
            <a class="button secondary" href="{{ url_for('rate_settings') }}">Abbrechen</a>
        </div>
    </form>
</div>

<script>
(function () {
    function parseEuroToCents(value) {
        if (!value) return 0;
        let raw = String(value).replace('€', '').replace(/\s/g, '').trim();
        if (!raw) return 0;
        if (raw.startsWith(',')) raw = '0' + raw;
        if (raw.includes(',')) raw = raw.replace(/\./g, '').replace(',', '.');
        else if ((raw.match(/\./g) || []).length > 1) raw = raw.replace(/\./g, '');
        if (!/^\d+(\.\d{0,2})?$/.test(raw)) return 0;
        const parsed = Number.parseFloat(raw);
        if (Number.isNaN(parsed)) return 0;
        return Math.round(parsed * 100);
    }
    function formatCents(cents) {
        return (cents / 100).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function normalizeMoneyInput(input) {
        const cents = parseEuroToCents(input.value);
        input.value = formatCents(cents);
    }
    document.querySelectorAll('.money-input').forEach(function (input) {
        input.addEventListener('focus', function () { if (input.value === '0,00') input.value = ''; });
        input.addEventListener('blur', function () { normalizeMoneyInput(input); });
    });
})();
</script>
{% endblock %}
